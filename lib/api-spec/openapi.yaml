      type: object
      required: [activities, sleep]
      properties:
        activities:
          type: array
          maxItems: 60
          items:
            type: object
            required: [date, type, durationMin, externalId]
            properties:
              date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
              type:
                type: string
                enum: [walk, run, strength, yoga, swim, cycle, steps, other]
              durationMin: { type: integer, minimum: 0, maximum: 1440 }
              steps: { type: ["integer", "null"], minimum: 0, maximum: 200000 }
              calories: { type: ["integer", "null"], minimum: 0, maximum: 10000 }
              distanceMi: { type: ["number", "null"], minimum: 0, maximum: 200 }
              externalId: { type: string, pattern: '^apple:[A-Za-z0-9:_-]+$', maxLength: 120 }
        sleep:
          type: array
          maxItems: 30
          items:
            type: object
            required: [date, durationMin, externalId]
            properties:
              date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
              durationMin: { type: integer, minimum: 1, maximum: 1440 }
              bedtime: { type: ["string", "null"], pattern: '^\d{2}:\d{2}$' }
              wakeTime: { type: ["string", "null"], pattern: '^\d{2}:\d{2}$' }
