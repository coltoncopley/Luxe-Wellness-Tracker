components:
  schemas:
    BillingStatus:
      type: object
      required: [status, exempt, priceCents]
      properties:
        status:
          type: string
          enum: [none, trialing, active, past_due, canceled, incomplete]
          description: Membership subscription status
        exempt:
          type: boolean
          description: True when this account (staff) does not need a subscription
        priceCents:
          type: integer
          description: Monthly membership price in cents
        trialEndsAt:
          type: string
          nullable: true
          description: ISO timestamp when the free trial ends, if trialing
        currentPeriodEnd:
          type: string
          nullable: true
          description: ISO timestamp when the current billing period ends
        cancelAtPeriodEnd:
          type: boolean
          description: True when the subscription is set to cancel at period end
        graceUntil:
          type: string
          nullable: true
          description: ISO timestamp when past-due grace access ends; set only while a failed payment is within the grace window
    CompAccess:
      type: object
      required: [userId, email, firstName, lifetime, until]
      properties:
        userId: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lifetime:
          type: boolean
          description: True when access is free for life
        until:
          type: ["string", "null"]
          description: ISO timestamp when free access expires (null if lifetime)
    GrantCompInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email of an existing patient account
        months:
          type: integer
          enum: [1, 3, 6, 12]
          description: Free months to grant (ignored when lifetime is true)
        lifetime:
          type: boolean
          description: Grant free access for life
    MembershipCode:
      type: object
      required:
        [
          id,
          code,
          kind,
          status,
          createdAt,
          createdByName,
          createdByEmail,
          redeemedAt,
          redeemedByName,
          redeemedByEmail,
          accessUntil,
          revokedAt,
        ]
      properties:
        id: { type: integer }
        code: { type: string }
        kind:
          type: string
          enum: [six_month, unlimited]
        status:
          type: string
          enum: [active, redeemed, expired, revoked]
          description: active = not yet used; redeemed = in use; expired = 6-month period over; revoked = access removed
        createdAt: { type: string, description: ISO timestamp }
        createdByName: { type: ["string", "null"] }
        createdByEmail: { type: ["string", "null"] }
        redeemedAt: { type: ["string", "null"], description: ISO timestamp }
        redeemedByName: { type: ["string", "null"] }
        redeemedByEmail: { type: ["string", "null"] }
        accessUntil:
          type: ["string", "null"]
          description: When the 6-month free period ends (null for unlimited codes)
        revokedAt: { type: ["string", "null"], description: ISO timestamp }
    CreateMembershipCodeInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [six_month, unlimited]
          description: six_month = staff or admin; unlimited = admin only
    RedeemMembershipCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 40
    RedeemMembershipCodeResult:
      type: object
      required: [kind, accessUntil]
      properties:
        kind:
          type: string
          enum: [six_month, unlimited]
        accessUntil:
          type: ["string", "null"]
          description: When free access ends (null for unlimited)
    StaffCode:
      type: object
      required:
        [
          id,
          code,
          label,
          status,
          createdAt,
          createdByName,
          createdByEmail,
          redeemedAt,
          redeemedByName,
          redeemedByEmail,
          revokedAt,
        ]
      properties:
        id: { type: integer }
        code: { type: string }
        label:
          type: ["string", "null"]
          description: Optional note for whom the code was made
        status:
          type: string
          enum: [active, redeemed, revoked]
          description: active = not yet used; redeemed = used to activate a staff account; revoked = cancelled before use
        createdAt: { type: string, description: ISO timestamp }
        createdByName: { type: ["string", "null"] }
        createdByEmail: { type: ["string", "null"] }
        redeemedAt: { type: ["string", "null"], description: ISO timestamp }
        redeemedByName: { type: ["string", "null"] }
        redeemedByEmail: { type: ["string", "null"] }
        revokedAt: { type: ["string", "null"], description: ISO timestamp }
    CreateStaffCodeInput:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
          description: Optional note for whom the code is (e.g. the staff member's name)
    AdminStaffMember:
      type: object
      required: [id, email, firstName, role, createdAt]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        role: { type: string, enum: [patient, staff, admin] }
        createdAt:
          type: string
          description: ISO timestamp
    UpdateStaffRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [patient, staff, admin]
          description: New role for the user (patient removes staff access)
    AddStaffByEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          description: Email of an existing account to grant staff access to
        role:
          type: string
          enum: [staff, admin]
          description: Role to grant (defaults to staff)
    AccessCodeSetting:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The staff access code
    UpdateAccessCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 20
          pattern: "^[A-Za-z0-9]+$"
          description: New staff access code (4-20 letters/numbers)
    Announcement:
      type: object
      required: [id, title, body, active, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          description: ISO timestamp
    CreateAnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        body:
          type: string
          minLength: 10
          maxLength: 1000
    UpdateAnnouncementInput:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    DoctorTip:
      type: object
      required: [id, title, body, status, source, createdAt, approvedAt, sentAt]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        status:
          type: string
          enum: [draft, approved, sent]
          description: draft = awaiting approval; approved = queued to go out; sent = published
        source:
          type: string
          enum: [ai, manual]
        createdAt: { type: string, description: ISO timestamp }
        approvedAt: { type: ["string", "null"], description: ISO timestamp }
        sentAt: { type: ["string", "null"], description: ISO timestamp }
    DoctorTipInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        body:
          type: string
          minLength: 10
          maxLength: 1000
    DoctorTipUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        body:
          type: string
          minLength: 10
          maxLength: 1000
        status:
          type: string
          enum: [draft, approved]
          description: Approve (queue to send) or move back to draft; sent tips cannot change
    Offer:
      type: object
      required: [id, title, description, endsAt, claimed, claimCode]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        endsAt: { type: string, description: ISO timestamp when the offer expires }
        claimed: { type: boolean }
        claimCode:
          type: ["string", "null"]
          description: The user's claim code if they already claimed this offer
    AdminOffer:
      type: object
      required: [id, title, description, endsAt, active, createdAt, claimCount, redeemedCount]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        endsAt: { type: string, description: ISO timestamp }
        active: { type: boolean }
        createdAt: { type: string, description: ISO timestamp }
        claimCount: { type: integer }
        redeemedCount: { type: integer }
    OfferInput:
      type: object
      required: [title, description, endsAt]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 1000
        endsAt:
          type: string
          description: ISO timestamp when the offer expires
    OfferUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
