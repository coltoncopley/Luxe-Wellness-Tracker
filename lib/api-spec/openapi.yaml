openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Med spa services and staff
  - name: appointments
    description: Patient appointment tracking
  - name: weight
    description: Weight and measurement tracking
  - name: food
    description: Food and calorie tracking
  - name: tips
    description: Wellness tips
  - name: dashboard
    description: Dashboard summaries
  - name: openai
    description: Luxe AI chat assistant
  - name: glow
    description: Daily Glow Score check-ins and streaks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all med spa services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /staff:
    get:
      operationId: listStaff
      tags: [services]
      summary: List staff members
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List tracked appointments
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Track a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /weight-entries:
    get:
      operationId: listWeightEntries
      tags: [weight]
      summary: List weight entries ordered by date
      responses:
        "200":
          description: Weight entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
    post:
      operationId: createWeightEntry
      tags: [weight]
      summary: Log a weight entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
  /weight-entries/{id}:
    delete:
      operationId: deleteWeightEntry
      tags: [weight]
      summary: Delete a weight entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /measurements:
    get:
      operationId: listMeasurements
      tags: [weight]
      summary: List body area measurements
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"
    post:
      operationId: createMeasurement
      tags: [weight]
      summary: Log a body area measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
  /measurements/{id}:
    delete:
      operationId: deleteMeasurement
      tags: [weight]
      summary: Delete a measurement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /goal:
    get:
      operationId: getGoal
      tags: [weight]
      summary: Get the active weight goal
      responses:
        "200":
          description: Goal (may be empty object defaults)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    put:
      operationId: setGoal
      tags: [weight]
      summary: Set or update the weight goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /weight/progress:
    get:
      operationId: getWeightProgress
      tags: [weight]
      summary: Weight progress summary (start, current, change, goal, pct to goal)
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightProgress"
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [food]
      summary: List restaurants with calorie data
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  /restaurants/{id}/menu-items:
    get:
      operationId: listMenuItems
      tags: [food]
      summary: List menu items for a restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /restaurants/{id}/healthy-picks:
    get:
      operationId: listHealthyPicks
      tags: [food]
      summary: Best menu items to order for healthy living at this restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Healthy picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /menu-items/search:
    get:
      operationId: searchMenuItems
      tags: [food]
      summary: Search menu items across all restaurants
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /food-logs:
    get:
      operationId: listFoodLogs
      tags: [food]
      summary: List food log entries, optionally by date (YYYY-MM-DD)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Food logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodLog"
    post:
      operationId: createFoodLog
      tags: [food]
      summary: Log a food entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodLog"
  /food-logs/{id}:
    delete:
      operationId: deleteFoodLog
      tags: [food]
      summary: Delete a food log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /food-logs/daily-summary:
    get:
      operationId: getDailySummary
      tags: [food]
      summary: Daily nutrition totals for a date (YYYY-MM-DD)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"
  /tips:
    get:
      operationId: listTips
      tags: [tips]
      summary: List wellness tips, optionally by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WellnessTip"
  /tips/daily:
    get:
      operationId: getDailyTip
      tags: [tips]
      summary: Tip of the day
      responses:
        "200":
          description: Tip of the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessTip"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard overview (weight, calories today, next appointment, streak)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /glow/summary:
    get:
      operationId: getGlowSummary
      tags: [glow]
      summary: Today's glow check-in, score, streak, and recent history
      responses:
        "200":
          description: Glow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlowSummary"
  /glow/checkin:
    put:
      operationId: upsertGlowCheckin
      tags: [glow]
      summary: Create or update today's glow check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlowCheckinInput"
      responses:
        "200":
          description: Saved check-in with computed score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlowCheckin"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      required: [id, name, category, description, bookingUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        durationMinutes: { type: ["integer", "null"] }
        priceText: { type: ["string", "null"] }
        bookingUrl: { type: string }
    StaffMember:
      type: object
      required: [id, name, title, bio, bookingUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        title: { type: string }
        bio: { type: string }
        photoUrl: { type: ["string", "null"] }
        bookingUrl: { type: string }
    Appointment:
      type: object
      required: [id, serviceName, date, status]
      properties:
        id: { type: integer }
        serviceName: { type: string }
        providerName: { type: ["string", "null"] }
        date: { type: string }
        time: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string }
    AppointmentInput:
      type: object
      required: [serviceName, date]
      properties:
        serviceName: { type: string, minLength: 1 }
        providerName: { type: string }
        date: { type: string }
        time: { type: string }
        notes: { type: string }
        status: { type: string }
    AppointmentUpdate:
      type: object
      properties:
        serviceName: { type: string, minLength: 1 }
        providerName: { type: string }
        date: { type: string }
        time: { type: string }
        notes: { type: string }
        status: { type: string }
    WeightEntry:
      type: object
      required: [id, date, weightLbs]
      properties:
        id: { type: integer }
        date: { type: string }
        weightLbs: { type: number }
        note: { type: ["string", "null"] }
    WeightEntryInput:
      type: object
      required: [date, weightLbs]
      properties:
        date: { type: string }
        weightLbs: { type: number }
        note: { type: string }
    Measurement:
      type: object
      required: [id, date, area, valueInches]
      properties:
        id: { type: integer }
        date: { type: string }
        area: { type: string }
        valueInches: { type: number }
    MeasurementInput:
      type: object
      required: [date, area, valueInches]
      properties:
        date: { type: string }
        area: { type: string, minLength: 1 }
        valueInches: { type: number }
    Goal:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        startWeightLbs: { type: ["number", "null"] }
        goalWeightLbs: { type: ["number", "null"] }
        targetDate: { type: ["string", "null"] }
        dailyCalorieTarget: { type: ["integer", "null"] }
    GoalInput:
      type: object
      properties:
        startWeightLbs: { type: number }
        goalWeightLbs: { type: number }
        targetDate: { type: string }
        dailyCalorieTarget: { type: integer }
    WeightProgress:
      type: object
      required: [entries]
      properties:
        startWeightLbs: { type: ["number", "null"] }
        currentWeightLbs: { type: ["number", "null"] }
        goalWeightLbs: { type: ["number", "null"] }
        totalChangeLbs: { type: ["number", "null"] }
        percentToGoal: { type: ["number", "null"] }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WeightEntry"
    Restaurant:
      type: object
      required: [id, name, cuisine]
      properties:
        id: { type: integer }
        name: { type: string }
        cuisine: { type: string }
        description: { type: ["string", "null"] }
    MenuItem:
      type: object
      required: [id, restaurantId, restaurantName, name, calories, isHealthyPick]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        restaurantName: { type: string }
        name: { type: string }
        calories: { type: integer }
        proteinG: { type: ["number", "null"] }
        carbsG: { type: ["number", "null"] }
        fatG: { type: ["number", "null"] }
        isHealthyPick: { type: boolean }
        orderingTip: { type: ["string", "null"] }
    FoodLog:
      type: object
      required: [id, date, mealType, foodName, calories]
      properties:
        id: { type: integer }
        date: { type: string }
        mealType: { type: string }
        foodName: { type: string }
        restaurantName: { type: ["string", "null"] }
        calories: { type: integer }
        proteinG: { type: ["number", "null"] }
        carbsG: { type: ["number", "null"] }
        fatG: { type: ["number", "null"] }
    FoodLogInput:
      type: object
      required: [date, mealType, foodName, calories]
      properties:
        date: { type: string }
        mealType: { type: string, minLength: 1 }
        foodName: { type: string, minLength: 1 }
        restaurantName: { type: string }
        calories: { type: integer }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
    DailySummary:
      type: object
      required: [date, totalCalories, totalProteinG, totalCarbsG, totalFatG, mealCount]
      properties:
        date: { type: string }
        totalCalories: { type: integer }
        totalProteinG: { type: number }
        totalCarbsG: { type: number }
        totalFatG: { type: number }
        mealCount: { type: integer }
        calorieTarget: { type: ["integer", "null"] }
    WellnessTip:
      type: object
      required: [id, category, title, content]
      properties:
        id: { type: integer }
        category: { type: string }
        title: { type: string }
        content: { type: string }
    DashboardSummary:
      type: object
      required: [caloriesToday, loggingStreakDays]
      properties:
        currentWeightLbs: { type: ["number", "null"] }
        weightChangeLbs: { type: ["number", "null"] }
        goalWeightLbs: { type: ["number", "null"] }
        caloriesToday: { type: integer }
        calorieTarget: { type: ["integer", "null"] }
        loggingStreakDays: { type: integer }
        nextAppointment:
          oneOf:
            - $ref: "#/components/schemas/Appointment"
            - type: "null"
    GlowCheckinInput:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD; defaults to today
        waterCups:
          type: integer
          minimum: 0
          maximum: 30
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
        stressLevel:
          type: integer
          minimum: 1
          maximum: 5
        activityMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        proteinGrams:
          type: integer
          minimum: 0
          maximum: 1000
        skincareDone:
          type: boolean
      required:
        - waterCups
        - sleepHours
        - stressLevel
        - activityMinutes
        - proteinGrams
        - skincareDone
    GlowCheckin:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        waterCups:
          type: integer
        sleepHours:
          type: number
        stressLevel:
          type: integer
        activityMinutes:
          type: integer
        proteinGrams:
          type: integer
        skincareDone:
          type: boolean
        score:
          type: integer
      required:
        - id
        - date
        - waterCups
        - sleepHours
        - stressLevel
        - activityMinutes
        - proteinGrams
        - skincareDone
        - score
    GlowHistoryPoint:
      type: object
      properties:
        date:
          type: string
        score:
          type: integer
      required:
        - date
        - score
    GlowSummary:
      type: object
      properties:
        today:
          oneOf:
            - $ref: "#/components/schemas/GlowCheckin"
            - type: "null"
        streakDays:
          type: integer
        history:
          type: array
          items:
            $ref: "#/components/schemas/GlowHistoryPoint"
      required:
        - today
        - streakDays
        - history
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
