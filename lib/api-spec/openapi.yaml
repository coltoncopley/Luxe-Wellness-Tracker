openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Med spa services and staff
  - name: appointments
    description: Patient appointment tracking
  - name: weight
    description: Weight and measurement tracking
  - name: food
    description: Food and calorie tracking
  - name: tips
    description: Wellness tips
  - name: dashboard
    description: Dashboard summaries
  - name: openai
    description: Luxe AI chat assistant
  - name: glow
    description: Daily Glow Score check-ins and streaks
  - name: social
    description: Friend follows, shared journeys, and cheers
  - name: me
    description: Current user profile
  - name: admin
    description: Staff-only management endpoints
  - name: billing
    description: Membership subscription billing
paths:
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the current user's membership status
      responses:
        "200":
          description: Membership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Stripe Checkout session for the membership (7-day free trial)
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe customer portal session to manage the membership
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all med spa services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /staff:
    get:
      operationId: listStaff
      tags: [services]
      summary: List staff members
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List tracked appointments
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Track a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /weight-entries:
    get:
      operationId: listWeightEntries
      tags: [weight]
      summary: List weight entries ordered by date
      responses:
        "200":
          description: Weight entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
    post:
      operationId: createWeightEntry
      tags: [weight]
      summary: Log a weight entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
  /weight-entries/{id}:
    delete:
      operationId: deleteWeightEntry
      tags: [weight]
      summary: Delete a weight entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /measurements:
    get:
      operationId: listMeasurements
      tags: [weight]
      summary: List body area measurements
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"
    post:
      operationId: createMeasurement
      tags: [weight]
      summary: Log a body area measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
  /measurements/{id}:
    delete:
      operationId: deleteMeasurement
      tags: [weight]
      summary: Delete a measurement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /goal:
    get:
      operationId: getGoal
      tags: [weight]
      summary: Get the active weight goal
      responses:
        "200":
          description: Goal (may be empty object defaults)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    put:
      operationId: setGoal
      tags: [weight]
      summary: Set or update the weight goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /weight/progress:
    get:
      operationId: getWeightProgress
      tags: [weight]
      summary: Weight progress summary (start, current, change, goal, pct to goal)
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightProgress"
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [food]
      summary: List restaurants with calorie data
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  /restaurants/{id}/menu-items:
    get:
      operationId: listMenuItems
      tags: [food]
      summary: List menu items for a restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /restaurants/{id}/healthy-picks:
    get:
      operationId: listHealthyPicks
      tags: [food]
      summary: Best menu items to order for healthy living at this restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Healthy picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /menu-items/search:
    get:
      operationId: searchMenuItems
      tags: [food]
      summary: Search menu items across all restaurants
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /food-logs:
    get:
      operationId: listFoodLogs
      tags: [food]
      summary: List food log entries, optionally by date (YYYY-MM-DD)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Food logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodLog"
    post:
      operationId: createFoodLog
      tags: [food]
      summary: Log a food entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodLog"
  /food-logs/{id}:
    delete:
      operationId: deleteFoodLog
      tags: [food]
      summary: Delete a food log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /food-logs/daily-summary:
    get:
      operationId: getDailySummary
      tags: [food]
      summary: Daily nutrition totals for a date (YYYY-MM-DD)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"
  /tips:
    get:
      operationId: listTips
      tags: [tips]
      summary: List wellness tips, optionally by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WellnessTip"
  /tips/daily:
    get:
      operationId: getDailyTip
      tags: [tips]
      summary: Tip of the day
      responses:
        "200":
          description: Tip of the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessTip"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard overview (weight, calories today, next appointment, streak)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /briefing:
    get:
      operationId: getBriefing
      tags: [briefing]
      summary: Personalized morning briefing (wellness score, todos, recap) — patient-private
      responses:
        "200":
          description: Morning briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
  /glow/summary:
    get:
      operationId: getGlowSummary
      tags: [glow]
      summary: Today's glow check-in, score, streak, and recent history
      responses:
        "200":
          description: Glow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlowSummary"
  /glow/checkin:
    put:
      operationId: upsertGlowCheckin
      tags: [glow]
      summary: Create or update today's glow check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlowCheckinInput"
      responses:
        "200":
          description: Saved check-in with computed score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlowCheckin"
  /food/analyze-photo:
    post:
      operationId: analyzeMealPhoto
      tags: [food]
      summary: Analyze a meal photo with AI and estimate calories and macros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPhotoAnalysisInput"
      responses:
        "200":
          description: Estimated nutrition for the meal in the photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPhotoAnalysis"
        "422":
          description: Photo could not be analyzed as food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /rewards/summary:
    get:
      operationId: getRewardsSummary
      tags: [rewards]
      summary: Points balance, earning history, and reward catalog
      responses:
        "200":
          description: Rewards summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsSummary"
  /rewards/redeem:
    post:
      operationId: redeemReward
      tags: [rewards]
      summary: Redeem points for a reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRewardInput"
      responses:
        "200":
          description: Redemption confirmation with code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResult"
        "400":
          description: Unknown reward or insufficient points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /rewards/redemptions/{code}:
    get:
      operationId: lookupRedemption
      tags: [rewards]
      summary: Look up a redemption by its code (staff verification)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redemption details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionDetail"
        "404":
          description: Code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /rewards/redemptions/{code}/use:
    post:
      operationId: markRedemptionUsed
      tags: [rewards]
      summary: Mark a redemption code as used (staff)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionDetail"
        "404":
          description: Code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "409":
          description: Code already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionDetail"
  /referrals/summary:
    get:
      operationId: getReferralSummary
      tags: [rewards]
      summary: The current user's referral code and invite stats
      responses:
        "200":
          description: Referral summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"
  /referrals/claim:
    post:
      operationId: claimReferral
      tags: [rewards]
      summary: Claim a friend's referral code after signing up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimReferralInput"
      responses:
        "200":
          description: Claim outcome (claimed=false includes a reason)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimReferralResult"
  /follows:
    get:
      operationId: getFollows
      tags: [social]
      summary: The current user's follows, followers, and pending requests
      responses:
        "200":
          description: Follows overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowsOverview"
  /follows/request:
    post:
      operationId: requestFollow
      tags: [social]
      summary: Request to follow a friend using their invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequestInput"
      responses:
        "200":
          description: Request outcome (requested=false includes a reason)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRequestResult"
  /follows/{id}/respond:
    post:
      operationId: respondToFollow
      tags: [social]
      summary: Accept or decline an incoming follow request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondFollowInput"
      responses:
        "200":
          description: Updated request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowActionResult"
        "404":
          description: Request not found
  /follows/{id}:
    delete:
      operationId: removeFollow
      tags: [social]
      summary: Unfollow, cancel a request, or remove a follower
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "404":
          description: Follow not found
  /friends/journeys:
    get:
      operationId: getFriendJourneys
      tags: [social]
      summary: Journey cards for friends you follow (respects their sharing settings)
      responses:
        "200":
          description: Friend journeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendJourneysResponse"
  /social/settings:
    get:
      operationId: getSharingSettings
      tags: [social]
      summary: What the current user shares with approved followers
      responses:
        "200":
          description: Sharing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingSettings"
    put:
      operationId: updateSharingSettings
      tags: [social]
      summary: Update sharing settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingSettings"
      responses:
        "200":
          description: Updated sharing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingSettings"
  /cheers:
    get:
      operationId: getCheers
      tags: [social]
      summary: Recent cheers received from friends
      responses:
        "200":
          description: Cheers received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheerList"
    post:
      operationId: sendCheer
      tags: [social]
      summary: Send a cheer to a friend you follow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCheerInput"
      responses:
        "200":
          description: Cheer sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCheerResult"
        "403":
          description: Not following this user
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get the current user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /me/staff-access:
    post:
      operationId: activateStaffAccess
      tags: [me]
      summary: Unlock staff role with an access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccessInput"
      responses:
        "200":
          description: Updated user with staff role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "403":
          description: Invalid access code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /admin/services:
    post:
      operationId: adminCreateService
      tags: [admin]
      summary: Create a service (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /admin/services/{id}:
    patch:
      operationId: adminUpdateService
      tags: [admin]
      summary: Update a service (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: adminDeleteService
      tags: [admin]
      summary: Delete a service (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /admin/restaurants:
    post:
      operationId: adminCreateRestaurant
      tags: [admin]
      summary: Create a restaurant (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantInput"
      responses:
        "201":
          description: Created restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
  /admin/restaurants/{id}:
    delete:
      operationId: adminDeleteRestaurant
      tags: [admin]
      summary: Delete a restaurant and its menu items (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /admin/restaurants/{id}/menu-items:
    post:
      operationId: adminCreateMenuItem
      tags: [admin]
      summary: Add a menu item to a restaurant (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /admin/menu-items/{id}:
    delete:
      operationId: adminDeleteMenuItem
      tags: [admin]
      summary: Delete a menu item (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /admin/reward-items:
    get:
      operationId: adminListRewardItems
      tags: [admin]
      summary: List all reward items including inactive (staff)
      responses:
        "200":
          description: Reward items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardItem"
    post:
      operationId: adminCreateRewardItem
      tags: [admin]
      summary: Create a reward item (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardItemInput"
      responses:
        "201":
          description: Created reward item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardItem"
  /admin/reward-items/{id}:
    patch:
      operationId: adminUpdateRewardItem
      tags: [admin]
      summary: Update a reward item (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardItemUpdate"
      responses:
        "200":
          description: Updated reward item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: adminDeleteRewardItem
      tags: [admin]
      summary: Deactivate a reward item (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deactivated
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /admin/redemptions:
    get:
      operationId: adminListRedemptions
      tags: [admin]
      summary: List all redemptions with patient info (staff)
      responses:
        "200":
          description: Redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRedemption"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
components:
  schemas:
    BillingStatus:
      type: object
      required: [status, exempt, priceCents]
      properties:
        status:
          type: string
          enum: [none, trialing, active, past_due, canceled, incomplete]
          description: Membership subscription status
        exempt:
          type: boolean
          description: True when this account (staff) does not need a subscription
        priceCents:
          type: integer
          description: Monthly membership price in cents
        trialEndsAt:
          type: string
          nullable: true
          description: ISO timestamp when the free trial ends, if trialing
        currentPeriodEnd:
          type: string
          nullable: true
          description: ISO timestamp when the current billing period ends
        cancelAtPeriodEnd:
          type: boolean
          description: True when the subscription is set to cancel at period end
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Stripe-hosted URL to redirect the user to
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      required: [id, name, category, description, bookingUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        durationMinutes: { type: ["integer", "null"] }
        priceText: { type: ["string", "null"] }
        bookingUrl: { type: string }
    StaffMember:
      type: object
      required: [id, name, title, bio, bookingUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        title: { type: string }
        bio: { type: string }
        photoUrl: { type: ["string", "null"] }
        bookingUrl: { type: string }
    Appointment:
      type: object
      required: [id, serviceName, date, status]
      properties:
        id: { type: integer }
        serviceName: { type: string }
        providerName: { type: ["string", "null"] }
        date: { type: string }
        time: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string }
    AppointmentInput:
      type: object
      required: [serviceName, date]
      properties:
        serviceName: { type: string, minLength: 1 }
        providerName: { type: string }
        date: { type: string }
        time: { type: string }
        notes: { type: string }
        status: { type: string }
    AppointmentUpdate:
