openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Med spa services and staff
  - name: appointments
    description: Patient appointment tracking
  - name: weight
    description: Weight and measurement tracking
  - name: food
    description: Food and calorie tracking
  - name: tips
    description: Wellness tips
  - name: dashboard
    description: Dashboard summaries
  - name: openai
    description: Luxe AI chat assistant
  - name: glow
    description: Daily Glow Score check-ins and streaks
  - name: social
    description: Friend follows, shared journeys, and cheers
  - name: me
    description: Current user profile
  - name: admin
    description: Staff-only management endpoints
  - name: billing
    description: Membership subscription billing
  - name: notifications
    description: Notification preferences and push subscriptions
paths:
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the current user's membership status
      responses:
        "200":
          description: Membership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Stripe Checkout session for the membership (7-day free trial)
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe customer portal session to manage the membership
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
  /billing/redeem-code:
    post:
      operationId: redeemMembershipCode
      tags: [billing]
      summary: Redeem a one-time membership access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemMembershipCodeInput"
      responses:
        "200":
          description: Code redeemed and access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemMembershipCodeResult"
        "400":
          description: Invalid or already used code
        "429":
          description: Too many attempts
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all med spa services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /staff:
    get:
      operationId: listStaff
      tags: [services]
      summary: List staff members
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List tracked appointments
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Track a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /weight-entries:
    get:
      operationId: listWeightEntries
      tags: [weight]
      summary: List weight entries ordered by date
      responses:
        "200":
          description: Weight entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntry"
    post:
      operationId: createWeightEntry
      tags: [weight]
      summary: Log a weight entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightEntry"
  /weight-entries/{id}:
    delete:
      operationId: deleteWeightEntry
      tags: [weight]
      summary: Delete a weight entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /measurements:
    get:
      operationId: listMeasurements
      tags: [weight]
      summary: List body area measurements
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"
    post:
      operationId: createMeasurement
      tags: [weight]
      summary: Log a body area measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
  /measurements/{id}:
    delete:
      operationId: deleteMeasurement
      tags: [weight]
      summary: Delete a measurement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /goal:
    get:
      operationId: getGoal
      tags: [weight]
      summary: Get the active weight goal
      responses:
        "200":
          description: Goal (may be empty object defaults)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    put:
      operationId: setGoal
      tags: [weight]
      summary: Set or update the weight goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /weight/progress:
    get:
      operationId: getWeightProgress
      tags: [weight]
      summary: Weight progress summary (start, current, change, goal, pct to goal)
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightProgress"
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [food]
      summary: List restaurants with calorie data
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  /restaurants/{id}/menu-items:
    get:
      operationId: listMenuItems
      tags: [food]
      summary: List menu items for a restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMyMenuItem
      tags: [food]
      summary: Add a menu item to a restaurant you added (owner-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid input
        "404":
          description: Not found
        "429":
          description: Menu item limit reached for this restaurant
  /restaurants/{id}/healthy-picks:
    get:
      operationId: listHealthyPicks
      tags: [food]
      summary: Best menu items to order for healthy living at this restaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Healthy picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /restaurants/custom:
    post:
      operationId: createCustomRestaurant
      tags: [food]
      summary: Add a personal restaurant — AI generates a typical menu with healthy picks (private to this patient)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomRestaurantInput"
      responses:
        "201":
          description: Restaurant created with AI-generated menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "400":
          description: Invalid input
        "409":
          description: You already added a restaurant with this name
        "422":
          description: Could not generate a menu for this restaurant
        "429":
          description: Daily limit reached
  /restaurants/discover:
    post:
      operationId: discoverRestaurants
      tags: [food]
      summary: Find real restaurants near a typed location via web search and add them to this patient's private list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverRestaurantsInput"
      responses:
        "201":
          description: Restaurants discovered and added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverRestaurantsResult"
        "400":
          description: Invalid input
        "422":
          description: Could not find restaurants near that location
        "429":
          description: Rate limit reached
  /restaurants/{id}:
    delete:
      operationId: deleteCustomRestaurant
      tags: [food]
      summary: Remove a restaurant you added (curated restaurants cannot be removed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /menu-items/{id}:
    patch:
      operationId: updateMyMenuItem
      tags: [food]
      summary: Edit a menu item on a restaurant you added (owner-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid input
        "404":
          description: Not found
    delete:
      operationId: deleteMyMenuItem
      tags: [food]
      summary: Remove a menu item from a restaurant you added (owner-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /menu-items/search:
    get:
      operationId: searchMenuItems
      tags: [food]
      summary: Search menu items across all restaurants
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /food-logs:
    get:
      operationId: listFoodLogs
      tags: [food]
      summary: List food log entries, optionally by date (YYYY-MM-DD)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Food logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodLog"
    post:
      operationId: createFoodLog
      tags: [food]
      summary: Log a food entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodLog"
  /food-logs/{id}:
    delete:
      operationId: deleteFoodLog
      tags: [food]
      summary: Delete a food log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /food-logs/daily-summary:
    get:
      operationId: getDailySummary
      tags: [food]
      summary: Daily nutrition totals for a date (YYYY-MM-DD)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"
  /tips:
    get:
      operationId: listTips
      tags: [tips]
      summary: List wellness tips, optionally by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WellnessTip"
  /tips/daily:
    get:
      operationId: getDailyTip
      tags: [tips]
      summary: Tip of the day
      responses:
        "200":
          description: Tip of the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessTip"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard overview (weight, calories today, next appointment, streak)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /briefing:
    get:
      operationId: getBriefing
      tags: [briefing]
      summary: Personalized morning briefing (wellness score, todos, recap) — patient-private
      responses:
        "200":
          description: Morning briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
  /glow/summary:
    get:
      operationId: getGlowSummary
      tags: [glow]
      summary: Today's glow check-in, score, streak, and recent history
      responses:
        "200":
          description: Glow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlowSummary"
  /glow/checkin:
    put:
      operationId: upsertGlowCheckin
      tags: [glow]
      summary: Create or update today's glow check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlowCheckinInput"
      responses:
        "200":
          description: Saved check-in with computed score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlowCheckin"
  /food/analyze-photo:
    post:
      operationId: analyzeMealPhoto
      tags: [food]
      summary: Analyze a meal photo with AI and estimate calories and macros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPhotoAnalysisInput"
      responses:
        "200":
          description: Estimated nutrition for the meal in the photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPhotoAnalysis"
        "422":
          description: Photo could not be analyzed as food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /missions:
    get:
      operationId: listMissions
      tags: [rewards]
      summary: This week's missions with progress (auto-awards completed ones)
      responses:
        "200":
          description: Weekly missions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionsResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [photos]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /photos:
    get:
      operationId: listProgressPhotos
      tags: [photos]
      summary: List the requesting user's progress photos (newest first)
      responses:
        "200":
          description: Progress photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressPhoto"
    post:
      operationId: createProgressPhoto
      tags: [photos]
      summary: Save an uploaded progress photo to the journal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgressPhotoInput"
      responses:
        "201":
          description: Photo saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhoto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /photos/{id}:
    delete:
      operationId: deleteProgressPhoto
      tags: [photos]
      summary: Delete a progress photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /photos/{id}/share:
    patch:
      operationId: setProgressPhotoShared
      tags: [photos]
      summary: Toggle whether one of your progress photos is visible to approved friends
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPhotoSharedInput"
      responses:
        "200":
          description: Updated photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhoto"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /skin-scan:
    get:
      operationId: getSkinScanHistory
      tags: [skin]
      summary: Weekly skin scan history for the requesting user
      responses:
        "200":
          description: Skin scan history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinScanHistory"
  /skin-scan/analyze:
    post:
      operationId: analyzeSkinScan
      tags: [skin]
      summary: Analyze a selfie with AI and save this week's skin scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeSkinScanInput"
      responses:
        "200":
          description: Scan analyzed and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinScanResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "422":
          description: The photo could not be analyzed (not a clear face photo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /ingredients:
    get:
      operationId: listIngredientScans
      tags: [ingredients]
      summary: Ingredient scan history for the requesting user
      responses:
        "200":
          description: Scan history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [scans]
                properties:
                  scans:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngredientScanResult"
  /ingredients/analyze:
    post:
      operationId: analyzeIngredients
      tags: [ingredients]
      summary: Analyze a skincare product ingredient label photo with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeIngredientsInput"
      responses:
        "200":
          description: Analysis saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientScanResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "422":
          description: The photo could not be analyzed (no readable ingredient list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /ingredients/{id}:
    delete:
      operationId: deleteIngredientScan
      tags: [ingredients]
      summary: Delete an ingredient scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /activities:
    get:
      operationId: listActivities
      tags: [activity]
      summary: List activity entries (newest first, last 90 days)
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activity]
      summary: Log an activity (manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /activities/{id}:
    delete:
      operationId: deleteActivity
      tags: [activity]
      summary: Delete a manually logged activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found or not deletable
  /activities/phone-steps:
    post:
      operationId: importPhoneSteps
      tags: [activity]
      summary: Import daily step counts read from the phone (patient-approved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneStepsImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /activities/apple-health:
    post:
      operationId: importAppleHealth
      tags: [activity]
      summary: Import activity and sleep read from Apple Health on the patient's iPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleHealthImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
    delete:
      operationId: deleteAppleHealthData
      tags: [activity]
      summary: Remove all previously imported Apple Health activity and sleep data
      responses:
        "204":
          description: Deleted
  /sleep-entries:
    get:
      operationId: listSleepEntries
      tags: [activity]
      summary: List sleep entries (newest first, last 90 days)
